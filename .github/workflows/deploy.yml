name: Deploy

# Staging deploys itself once main is green. Production never does: the repo rule
# is that it ships only when the owner says so, so it is manual, gated by a
# GitHub Environment, and refuses to run from anywhere but main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
        required: true

# One deploy at a time per environment. Two racing deploys can leave the Worker
# running a build nobody asked for, and cancel-in-progress is wrong here: a
# half-finished upload is worse than a queued one.
concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Production is the one place a wrong click costs real money, so refuse any
      # ref but main rather than trusting the person dispatching to notice.
      - name: Refuse a production deploy from a branch
        if: inputs.environment == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deploys only from main. This ref is ${{ github.ref }}."
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx opennextjs-cloudflare build

      # Deploys code only. Migrations are deliberately NOT run here: D1 rolls a
      # migration back on an FK violation, so a rollback looks exactly like a
      # success unless someone compares row counts. See migrate-database.yml.
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env ${{ inputs.environment || 'staging' }}

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo
            echo "- Environment: \`${{ inputs.environment || 'staging' }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Ref: \`${{ github.ref_name }}\`"
            echo
            echo "Database migrations were NOT applied. Run the"
            echo "\"Migrate database\" workflow if this release needs one."
          } >> "$GITHUB_STEP_SUMMARY"
