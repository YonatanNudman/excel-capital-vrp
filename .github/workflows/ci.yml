name: CI

on:
  pull_request:
  # Kept from Gilad's change: lets the checks be run on demand.
  workflow_dispatch:
  # Called by deploy.yml so a deploy runs the SAME checks as CI. Duplicating the
  # steps there would let the two drift, and the copy that matters is the one
  # guarding a deploy.
  #
  # Deliberately NOT triggered on push to main: deploy.yml already runs on that
  # and calls this, so a push trigger here would run everything twice.
  workflow_call:

# A superseded run tells you nothing useful, so stop it and save the minutes.
#
# github.workflow is the CALLING workflow's name, so a run invoked by deploy.yml
# lands in a different group from a plain CI run. Without that they would collide
# on the same ref and cancel each other, and the one cancelled could be the deploy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Run through the npm scripts rather than repeating the vitest flags here,
      # so the config files can move without silently skipping a suite.
      - name: Unit tests
        run: npm run test:unit

      - name: D1 integration tests (Workers pool)
        run: npm run test:integration

      - name: Build (OpenNext for Cloudflare)
        run: npx opennextjs-cloudflare build
