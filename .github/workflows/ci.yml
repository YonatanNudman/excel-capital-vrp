name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run -c vitest.config.ts

      - name: D1 integration tests (Workers pool)
        run: npx vitest run -c vitest.workers.config.mts

      - name: Build (OpenNext for Cloudflare)
        run: npx opennextjs-cloudflare build
