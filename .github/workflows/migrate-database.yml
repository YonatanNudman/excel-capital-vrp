name: Migrate database

# Separate from Deploy, and manual, on purpose.
#
# D1 rolls a migration back when it hits a foreign key violation, and reports it
# the same way it reports success. Migration 0004 taught us the other half: an
# ALTER TABLE ... RENAME makes SQLite silently rewrite the FK clauses in every
# table that references the renamed one, which repointed payments and
# payment_intents at a temporary table.
#
# So this workflow refuses to just run migrations. It records row counts and the
# FK clauses before and after, fails if the FK text changed, and prints both sets
# of counts so a rollback cannot be mistaken for a success.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which database
        type: choice
        options: [staging, production]
        default: staging
        required: true
      confirm:
        description: Type the environment name to confirm
        type: string
        required: true

concurrency:
  group: migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ inputs.environment }}
    steps:
      # Typing the environment name is the whole point: it makes migrating
      # production a deliberate act rather than a default dropdown value.
      - name: Confirm the target
        run: |
          if [ "${{ inputs.confirm }}" != "$TARGET" ]; then
            echo "::error::Type '$TARGET' in the confirm box to migrate it."
            exit 1
          fi

      - name: Refuse a production migration from a branch
        if: inputs.environment == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production migrations only from main. This ref is ${{ github.ref }}."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record state before
        run: ./scripts/d1-state.sh "$TARGET" before

      - name: Apply migrations
        run: npx wrangler d1 migrations apply DB --remote --env "$TARGET"

      - name: Record state after
        run: ./scripts/d1-state.sh "$TARGET" after

      # The FK check is the migration 0004 detector. A change here means SQLite
      # rewrote a reference and the ledger may now point somewhere it should not,
      # so fail loudly rather than leave it in a summary nobody reads.
      - name: Fail if foreign keys were rewritten
        run: |
          if ! diff -u /tmp/fk-before.txt /tmp/fk-after.txt; then
            echo "::error::Foreign key clauses changed. Do NOT deploy. See migrations/0004 and docs/RUNBOOK.md."
            exit 1
          fi
          echo "Foreign key clauses unchanged."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Migrated \`$TARGET\`"
            echo
            echo "Row counts BEFORE:"
            echo '```json'
            cat /tmp/counts-before.txt 2>/dev/null || echo "(not captured)"
            echo '```'
            echo "Row counts AFTER:"
            echo '```json'
            cat /tmp/counts-after.txt 2>/dev/null || echo "(not captured)"
            echo '```'
            echo "Compare these. An additive migration should change nothing."
          } >> "$GITHUB_STEP_SUMMARY"
