name: Verify Cloudflare credentials

# TEMPORARY. Proves the CLOUDFLARE_API_TOKEN secret can actually publish, by doing
# a real staging deploy through the same steps deploy.yml uses. Delete once green.
on:
  push:
    branches: [multiple-destinations]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Check permissions
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          [ -n "${TOKEN:-}" ] || { echo "::error::CLOUDFLARE_API_TOKEN is not set."; exit 1; }

          api() {
            curl -s -o /tmp/body.json -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              "https://api.cloudflare.com/client/v4$1"
          }

          # NOT /user/tokens/verify: that is a user endpoint and returns 401 for an
          # account-scoped token even when the token is perfectly good. Checking the
          # capabilities we actually need avoids that false alarm.
          fail=0
          code=$(api "/accounts/$ACCOUNT/workers/scripts")
          [ "$code" = "200" ] && echo "PASS  Workers access" || { echo "FAIL  Workers access (HTTP $code)"; fail=1; }

          code=$(api "/accounts/$ACCOUNT/d1/database")
          if [ "$code" = "200" ]; then
            n=$(python3 -c "import json;print(len(json.load(open('/tmp/body.json'))['result']))" 2>/dev/null || echo '?')
            echo "PASS  D1 access ($n databases visible)"
          else
            echo "FAIL  D1 access (HTTP $code)"; fail=1
          fi
          [ "$fail" -eq 0 ] || { echo "::error::Token is missing permissions."; exit 1; }

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx opennextjs-cloudflare build

      # The real proof. Staging only, and staging already runs this branch.
      - name: Deploy to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
