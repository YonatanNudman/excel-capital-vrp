name: Verify Cloudflare credentials

# TEMPORARY. Checks the CLOUDFLARE_API_TOKEN secret has the permissions the deploy
# and migrate workflows need, without deploying anything. Delete once confirmed.
on:
  push:
    branches: [multiple-destinations]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check token and permissions
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set at all."
            exit 1
          fi
          echo "Token secret is present (length hidden)."

          api() {
            # Prints only the HTTP status. Never the body, which can echo the token.
            curl -s -o /tmp/body.json -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4$1"
          }

          fail=0

          code=$(api "/user/tokens/verify")
          if [ "$code" = "200" ]; then
            echo "PASS  token is valid"
          else
            echo "FAIL  token is not valid (HTTP $code)"
            fail=1
          fi

          code=$(api "/accounts/$ACCOUNT/workers/scripts")
          if [ "$code" = "200" ]; then
            echo "PASS  can read Workers scripts (needed to deploy)"
          else
            echo "FAIL  cannot read Workers scripts (HTTP $code) -> deploys will not work"
            fail=1
          fi

          code=$(api "/accounts/$ACCOUNT/d1/database")
          if [ "$code" = "200" ]; then
            n=$(python3 -c "import json;print(len(json.load(open('/tmp/body.json'))['result']))" 2>/dev/null || echo '?')
            echo "PASS  can read D1 databases (needed to migrate). Found: $n"
          else
            echo "FAIL  cannot read D1 databases (HTTP $code) -> migrations will not work"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::The token is missing permissions. See the FAIL lines above."
            exit 1
          fi
          echo "All checks passed."
